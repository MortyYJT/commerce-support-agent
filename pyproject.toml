[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-support-agent"
version = "0.1.0"
description = "A validated FastAPI backend for an e-commerce support assistant."
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.142.2",
  "langchain==1.4.3",
  "langchain-core==1.6.6",
  "langchain-openai==1.6.7",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "python-dotenv==1.2.4",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.13.1",
  "pytest==8.4.2",
  "ruff==0.16.10",
  "setuptools==84.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
commerce_support = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
