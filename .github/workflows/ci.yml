name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install the application package
        run: python -m pip install --no-deps --no-build-isolation --editable .
      - name: Run Ruff
        run: ruff check .
      - name: Run offline tests without MySQL integration tests
        run: pytest -q -m "not integration"

  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: mysql+asyncmy://commerce_support:ci-user-test-only@127.0.0.1:3306/commerce_support_test_ci
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: ci-root-test-only
          MYSQL_DATABASE: commerce_support_test_ci
          MYSQL_USER: commerce_support
          MYSQL_PASSWORD: ci-user-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=ci-root-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Require the disposable MySQL integration database
        run: test -n "${TEST_DATABASE_URL:-}"
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install the application package
        run: python -m pip install --no-deps --no-build-isolation --editable .
      - name: Run MySQL integration tests
        run: pytest tests/integration -m integration -q

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the pinned runtime image
        run: docker build --tag commerce-support-agent:ci .
