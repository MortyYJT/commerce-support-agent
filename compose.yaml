services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: commerce_support
      MYSQL_USER: commerce_support
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init/01-create-test-database.sql:/docker-entrypoint-initdb.d/01-create-test-database.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --silent --host=127.0.0.1 --user=root --password="$$MYSQL_ROOT_PASSWORD"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  mysql_data:
